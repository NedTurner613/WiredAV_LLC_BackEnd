spring:
  application:
    name: appointment-service

  datasource:
    url: jdbc:h2:mem:appointmentsdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        globally_quoted_identifiers: true
    show-sql: true

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
